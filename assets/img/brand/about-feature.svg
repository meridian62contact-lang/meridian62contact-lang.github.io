<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="A meridian line traced across a globe, in gold on dark navy">
  <defs>
    <radialGradient id="glow-core" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#10203A" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#10203A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="50%" cy="105%" r="70%">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#C9A45C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="#070B14"/>
  <rect width="800" height="800" fill="url(#glow-core)"/>
  <rect width="800" height="800" fill="url(#glow-gold)"/>

  <g stroke="#C9A45C" stroke-opacity="0.16" stroke-width="1" fill="none">
    <circle cx="400" cy="400" r="380"/>
    <ellipse cx="400" cy="400" rx="380" ry="180"/>
    <ellipse cx="400" cy="400" rx="380" ry="65"/>
    <ellipse cx="400" cy="400" rx="180" ry="380"/>
    <ellipse cx="400" cy="400" rx="65" ry="380"/>
    <line x1="20" y1="400" x2="780" y2="400"/>
    <line x1="400" y1="20" x2="400" y2="780"/>
  </g>

  <g fill="none">
    <circle cx="400" cy="400" r="170" stroke="#F2ECDD" stroke-opacity="0.55" stroke-width="2.5"/>
    <ellipse cx="400" cy="400" rx="70" ry="170" stroke="#F2ECDD" stroke-opacity="0.55" stroke-width="2.5"/>
    <line x1="230" y1="400" x2="570" y2="400" stroke="#C9A45C" stroke-width="2.5"/>
    <circle cx="487" cy="400" r="14" fill="#C9A45C"/>
  </g>

  <text x="400" y="640" text-anchor="middle" font-family="'Bodoni Moda','Didot','Times New Roman',serif" font-style="italic" font-size="30" fill="#C9A45C" letter-spacing="10">MERIDIAN · SIXTY-TWO</text>
</svg>
